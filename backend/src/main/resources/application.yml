server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,application/javascript,text/css,text/html

spring:
  application:
    name: dataagent-cloud
  datasource:
    url: ${METADATA_DB_URL:jdbc:h2:file:./data/dataagent;MODE=PostgreSQL;AUTO_SERVER=TRUE}
    username: ${METADATA_DB_USER:sa}
    password: ${METADATA_DB_PASSWORD:}
    driver-class-name: ${METADATA_DB_DRIVER:org.h2.Driver}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: dataagent-metadata
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false
        type.preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: ${DATAAGENT_REDIS_ENABLED:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

dataagent:
  security:
    api-token: ${DATAAGENT_API_TOKEN:dataagent-dev-token}
    secret-key: ${DATAAGENT_SECRET_KEY:dataagent-dev-secret-change-me}
    user-header: X-User-Id
  cors:
    allowed-origins: ${DATAAGENT_CORS_ORIGINS:http://127.0.0.1:49224,http://localhost:49224,http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:61025,http://localhost:61025,dsh-app://*}
  demo:
    enabled: ${DATAAGENT_DEMO_ENABLED:true}
  query:
    default-max-rows: 500
    hard-max-rows: 5000
    default-timeout-seconds: 15
    hard-timeout-seconds: 60
    max-sql-length: 100000
    # Slow queries automatically collect EXPLAIN (never EXPLAIN ANALYZE).
    auto-plan-threshold-ms: 500
    cache-enabled: ${DATAAGENT_QUERY_CACHE_ENABLED:true}
    cache-ttl-seconds: ${DATAAGENT_QUERY_CACHE_TTL_SECONDS:30}
    cache-max-entries: ${DATAAGENT_QUERY_CACHE_MAX_ENTRIES:200}
    max-concurrent-queries: ${DATAAGENT_MAX_CONCURRENT_QUERIES:16}
    max-concurrent-per-datasource: ${DATAAGENT_MAX_CONCURRENT_PER_DATASOURCE:4}
  semantic:
    sync-enabled: ${DATAAGENT_SEMANTIC_SYNC_ENABLED:true}
    sync-interval-ms: ${DATAAGENT_SEMANTIC_SYNC_INTERVAL_MS:1800000}
    sync-initial-delay-ms: ${DATAAGENT_SEMANTIC_SYNC_INITIAL_DELAY_MS:120000}
  benchmark:
    sync-enabled: ${DATAAGENT_BENCHMARK_SYNC_ENABLED:true}
    sync-interval-ms: ${DATAAGENT_BENCHMARK_SYNC_INTERVAL_MS:3600000}
    sync-initial-delay-ms: ${DATAAGENT_BENCHMARK_SYNC_INITIAL_DELAY_MS:300000}
  pii:
    enabled: ${DATAAGENT_PII_ENABLED:true}
    mask-enabled: ${DATAAGENT_PII_MASK_ENABLED:true}
  redis:
    enabled: ${DATAAGENT_REDIS_ENABLED:false}
    key-prefix: ${DATAAGENT_REDIS_KEY_PREFIX:dataagent}
    quota-ttl-seconds: ${DATAAGENT_REDIS_QUOTA_TTL_SECONDS:120}
  resilience:
    failure-threshold: ${DATAAGENT_CIRCUIT_FAILURE_THRESHOLD:5}
    open-ms: ${DATAAGENT_CIRCUIT_OPEN_MS:30000}
    slow-threshold-ms: ${DATAAGENT_SLOW_THRESHOLD_MS:5000}
    slow-cooldown-ms: ${DATAAGENT_SLOW_COOLDOWN_MS:60000}
  audit:
    retention-days: ${DATAAGENT_AUDIT_RETENTION_DAYS:90}
    export-dir: ${DATAAGENT_AUDIT_EXPORT_DIR:./data/audit-exports}
    siem-webhook: ${DATAAGENT_AUDIT_SIEM_WEBHOOK:}
    object-store-url: ${DATAAGENT_AUDIT_OBJECT_STORE_URL:}
    object-store-token: ${DATAAGENT_AUDIT_OBJECT_STORE_TOKEN:}

logging:
  level:
    root: INFO
    com.dataagent: INFO
    org.hibernate.SQL: WARN

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${METADATA_DB_URL:jdbc:postgresql://localhost:5432/dataagent}
    username: ${METADATA_DB_USER:dataagent}
    password: ${METADATA_DB_PASSWORD:dataagent}
    driver-class-name: org.postgresql.Driver
