server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,application/javascript,text/css,text/html

spring:
  application:
    name: dataagent-cloud
  datasource:
    url: ${METADATA_DB_URL:jdbc:h2:file:./data/dataagent;MODE=PostgreSQL;AUTO_SERVER=TRUE}
    username: ${METADATA_DB_USER:sa}
    password: ${METADATA_DB_PASSWORD:}
    driver-class-name: ${METADATA_DB_DRIVER:org.h2.Driver}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: dataagent-metadata
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false
        type.preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

dataagent:
  security:
    api-token: ${DATAAGENT_API_TOKEN:dataagent-dev-token}
    secret-key: ${DATAAGENT_SECRET_KEY:dataagent-dev-secret-change-me}
    user-header: X-User-Id
  cors:
    allowed-origins: ${DATAAGENT_CORS_ORIGINS:http://127.0.0.1:49224,http://localhost:49224,http://127.0.0.1:5173,http://localhost:5173}
  demo:
    enabled: ${DATAAGENT_DEMO_ENABLED:true}
  query:
    default-max-rows: 500
    hard-max-rows: 5000
    default-timeout-seconds: 15
    hard-timeout-seconds: 60
    max-sql-length: 100000
    # Slow queries automatically collect EXPLAIN (never EXPLAIN ANALYZE).
    auto-plan-threshold-ms: 500

logging:
  level:
    root: INFO
    com.dataagent: INFO
    org.hibernate.SQL: WARN

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${METADATA_DB_URL:jdbc:postgresql://localhost:5432/dataagent}
    username: ${METADATA_DB_USER:dataagent}
    password: ${METADATA_DB_PASSWORD:dataagent}
    driver-class-name: org.postgresql.Driver
