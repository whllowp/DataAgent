name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test
        run: mvn -B test
      - name: Package
        run: mvn -B -DskipTests package

  studio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify no generated artifacts are tracked
        working-directory: .
        run: |
          if git ls-files | grep -E 'backend/src/main/resources/static/studio|dsh-plugin/client\.js|backend/target|node_modules'; then
            echo "Generated artifacts must not be tracked"; exit 1
          fi
